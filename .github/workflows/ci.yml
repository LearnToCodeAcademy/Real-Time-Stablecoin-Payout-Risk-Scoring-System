name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Secret scan
        run: detect-secrets scan --baseline .secrets.baseline
      - name: Lint
        run: ruff check api.py db.py risk_system stream_listener.py tests
      - name: Format check
        run: ruff format --check api.py db.py risk_system stream_listener.py tests
      - name: Type check upgraded modules
        run: mypy --follow-imports=skip risk_system api.py db.py stream_listener.py
      - name: Tests
        env:
          DATABASE_URL: ""
          ENABLE_LOCAL_TRAINING: "false"
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
